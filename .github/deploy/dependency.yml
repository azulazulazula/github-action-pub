# Resource definitions, change paths, and deployment dependencies.
resources:
  vpc:
    paths:
      - .github/workflows/cfm/vpc/**
    depends_on: []
    workflow: .github/workflows/create-vpc.yml
    template: .github/workflows/cfm/vpc/vpc.yml

  s3:
    paths:
      - .github/workflows/cfm/s3/**
    depends_on: []
    workflow: .github/workflows/create-s3.yml
    template: .github/workflows/cfm/s3/s3.yml

  ec2:
    paths:
      - .github/workflows/cfm/ec2.yml
    depends_on:
      - vpc
    workflow: .github/workflows/deploy-ec2.yml
    template: .github/workflows/cfm/ec2.yml

  ecs-infrastructure:
    paths:
      - .github/workflows/cfm/ecs/ecs-infrastructure.yml
      - .github/workflows/cfm/ecs-codebuild/**
      - .github/workflows/provision-ecs-infrastructure.yml
    depends_on:
      - vpc
    workflow: .github/workflows/provision-ecs-infrastructure.yml
    template: .github/workflows/cfm/ecs/ecs-infrastructure.yml

  ecs-application:
    paths:
      - Dockerfile
      - src/**
      - .github/ecs/**
      - .github/workflows/cfm/ecs/ecs-application.yml
      - .github/workflows/deploy-ecs-application.yml
    depends_on:
      - vpc
      - ecs-infrastructure
    workflow: .github/workflows/deploy-ecs-application.yml
    template: .github/workflows/cfm/ecs/ecs-application.yml
