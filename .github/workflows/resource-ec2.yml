name: Echo EC2 resource

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique parent request identifier
        required: true
        type: string

run-name: Echo EC2 from parent ${{ inputs.request_id }}

permissions:
  contents: read

jobs:
  echo-service:
    runs-on: ubuntu-latest
    steps:
      - name: Echo service name
        run: echo "EC2"
