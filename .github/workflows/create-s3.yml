name: Create S3 prototype

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfm/s3/**'
      - '.github/workflows/create-s3.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: create-s3-prototype
  cancel-in-progress: false

jobs:
  create-s3:
    runs-on: ubuntu-22.04
    environment: prod
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::798452926315:role/ra-men-role
          aws-region: ap-south-1
          allowed-account-ids: "798452926315"

      - name: Validate and deploy S3 stack
        run: |
          set -euo pipefail

          aws cloudformation validate-template \
            --template-body file://.github/workflows/cfm/s3/s3.yml

          aws cloudformation deploy \
            --template-file .github/workflows/cfm/s3/s3.yml \
            --stack-name eiei-mun-s3-prototype \
            --no-fail-on-empty-changeset

          aws cloudformation describe-stacks \
            --stack-name eiei-mun-s3-prototype \
            --query 'Stacks[0].Outputs' \
            --output table
