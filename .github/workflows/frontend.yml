name: frontend

on:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: aws s3 sync . s3://amzn-github-action-test-azula --exact-timestamps
          AWS_ACCESS_KEY_ID: ${{ secrets.ACC_ID }}
          AWS_SECRET_ACCESS_KEY_ID: ${{ secrets.SEC_ACC_ID }}