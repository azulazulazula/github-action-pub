name: frontend

on:
  push:
    branches:
      - main
    pathes:
      - 'frontend/**'
      - '.github/**'

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Show GitHub repository IDs
        run: |
          echo "repository_owner_id=${{ github.repository_owner_id }}"
          echo "repository_id=${{ github.repository_id }}"

      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::200321260769:role/oidc-pol
          aws-region: ap-northeast-1

      - run: aws s3 sync . s3://amzn-github-action-test-azula --exact-timestamps
