name: Build and deploy Hello World to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hello-world-ecs
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: '798452926315'
  ECS_CLUSTER: hello-nginx-cluster
  ECS_SERVICE: hello-nginx-service
  ECR_REPOSITORY: hello-nginx
  TASK_DEFINITION: .github/ecs/task-definition.json
  CONTAINER_NAME: hello-world

jobs:
  build-jar:
    name: Build executable JAR
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile and package JAR
        run: |
          set -euo pipefail
          mkdir -p build/classes
          javac --release 21 --add-modules jdk.httpserver \
            -d build/classes \
            src/main/java/hello/HelloWorldServer.java
          jar --create --file build/hello-world.jar \
            --main-class hello.HelloWorldServer \
            -C build/classes .

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-world-jar
          path: build/hello-world.jar
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Build image and deploy to ECS
    needs: build-jar
    runs-on: ubuntu-22.04
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: hello-world-jar
          path: build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::798452926315:role/ra-men-role
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push container image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --file Dockerfile --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Add Docker FROM image tag to task definition
        run: |
          set -euo pipefail
          FROM_IMAGE="$(awk '$1 == "FROM" { image=$NF; sub(/#.*/, "", image); print image; exit }' Dockerfile)"
          if [[ -z "$FROM_IMAGE" ]]; then
            echo "No FROM image found in Dockerfile" >&2
            exit 1
          fi
          FROM_NAME="${FROM_IMAGE%:*}"
          jq --arg value "${FROM_NAME}:${GITHUB_SHA}" '.tags = ((.tags // []) + [{"key":"from","value":$value}])' \
            "$TASK_DEFINITION" > build/task-definition.json

      - name: Render task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: build/task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.uri }}

      - name: Register task definition and deploy service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          propagate-tags: TASK_DEFINITION
          wait-for-service-stability: true
