name: Deploy Hello World to ECS with CloudFormation
run-name: Deploy ecs request ${{ inputs.request_id }}

on:
  workflow_call:
    inputs:
      request_id:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      request_id:
        description: Parent orchestration request identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-hello-world-ecs
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: '798452926315'
  ECS_CLUSTER: eiei-mun-ecs-prototype
  ECS_SERVICE: eiei-mun-hello-world
  ECR_REPOSITORY: hello-nginx
  ECS_STACK: eiei-mun-ecs-prototype

jobs:
  build-jar:
    name: Build executable JAR
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile and package JAR
        run: |
          set -euo pipefail
          mkdir -p build/classes
          find src/main/java -name '*.java' -print0 | xargs -0 javac --release 21 --add-modules jdk.httpserver -d build/classes
          jar --create --file build/hello-world.jar \
            --main-class hello.HelloWorldServer \
            -C build/classes .

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-world-jar
          path: build/hello-world.jar
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Build image and deploy ECS stack
    needs: build-jar
    runs-on: ubuntu-22.04
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: hello-world-jar
          path: build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::798452926315:role/ra-men-role
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push container image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --file Dockerfile --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Read VPC outputs and Docker base image tag
        id: deploy-inputs
        run: |
          set -euo pipefail

          VPC_ID=$(aws cloudformation describe-stacks \
            --stack-name eiei-mun-vpc-prototype \
            --query "Stacks[0].Outputs[?OutputKey=='VpcId'].OutputValue | [0]" \
            --output text)
          SUBNET_ID=$(aws cloudformation describe-stacks \
            --stack-name eiei-mun-vpc-prototype \
            --query "Stacks[0].Outputs[?OutputKey=='PublicSubnetId'].OutputValue | [0]" \
            --output text)
          test "$VPC_ID" != "None"
          test "$SUBNET_ID" != "None"

          FROM_IMAGE="$(awk '$1 == "FROM" { image=$NF; sub(/#.*/, "", image); print image; exit }' Dockerfile)"
          if [[ -z "$FROM_IMAGE" ]]; then
            echo "No FROM image found in Dockerfile" >&2
            exit 1
          fi
          BASE_IMAGE="${FROM_IMAGE%:*}"

          echo "vpc_id=$VPC_ID" >> "$GITHUB_OUTPUT"
          echo "subnet_id=$SUBNET_ID" >> "$GITHUB_OUTPUT"
          echo "base_image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Validate and deploy ECS CloudFormation stack
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          VPC_ID: ${{ steps.deploy-inputs.outputs.vpc_id }}
          PUBLIC_SUBNET_ID: ${{ steps.deploy-inputs.outputs.subnet_id }}
          BASE_IMAGE: ${{ steps.deploy-inputs.outputs.base_image }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          aws cloudformation validate-template \
            --template-body file://.github/workflows/cfm/ecs/ecs.yml

          aws cloudformation deploy \
            --template-file .github/workflows/cfm/ecs/ecs.yml \
            --stack-name "$ECS_STACK" \
            --parameter-overrides \
              ImageUri="$IMAGE_URI" \
              BaseImage="$BASE_IMAGE" \
              SourceRevision="$SOURCE_REVISION" \
              VpcId="$VPC_ID" \
              PublicSubnetId="$PUBLIC_SUBNET_ID" \
            --no-fail-on-empty-changeset

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          TASK_ARN=$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$ECS_SERVICE" \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)
          test "$TASK_ARN" != "None"

          ENI_ID=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value | [0]" \
            --output text)
          test "$ENI_ID" != "None"

          PUBLIC_IP=$(aws ec2 describe-network-interfaces \
            --network-interface-ids "$ENI_ID" \
            --query 'NetworkInterfaces[0].Association.PublicIp' \
            --output text)
          test "$PUBLIC_IP" != "None"

          echo "Hello World URL: http://$PUBLIC_IP:8080" | tee -a "$GITHUB_STEP_SUMMARY"
          aws cloudformation describe-stacks \
            --stack-name "$ECS_STACK" \
            --query 'Stacks[0].Outputs' \
            --output table
