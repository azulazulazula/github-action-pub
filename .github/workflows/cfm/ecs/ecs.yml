AWSTemplateFormatVersion: "2010-09-09"
Description: Public Hello World Fargate service — keeps the Java app behind an Nginx proxy on HTTP port 80.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: One Fargate task in the existing public subnet; Nginx exposes the Java app on port 80.
    must:
      - Keep the app container reachable only through the in-task Nginx proxy.
      - Keep the task in the dedicated prototype VPC and public subnet.
      - Keep task tags for base image and source revision.
      - Public HTTP access is for this temporary prototype only.

Parameters:
  ImageUri:
    Type: String
    Description: Immutable ECR image URI built by the deployment workflow.
  BaseImage:
    Type: String
    Description: Base image name from the Dockerfile FROM instruction.
  SourceRevision:
    Type: String
    Description: Git commit deployed to this service.
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id

Resources:
  HelloWorldLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Retains short-lived application logs for deployment troubleshooting.
        must:
          - Keep a bounded retention period for this prototype.
        mutable: review-required
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}"
      RetentionInDays: 7

  HelloWorldSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Dedicated task security group; public HTTP reaches only the Nginx proxy.
        must:
          - Do not attach this group to unrelated workloads.
          - Keep application port 8080 closed to external ingress.
        mutable: review-required
    Properties:
      GroupDescription: Public HTTP access to the Hello World Nginx proxy
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Browser access to the prototype web page
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-tasks"

  HelloWorldCluster:
    Type: AWS::ECS::Cluster
    Metadata:
      com.aws.cloudformation.Context:
        why: Fargate cluster for the single Hello World service.
        must:
          - Keep this prototype isolated from other application clusters.
        mutable: review-required
    Properties:
      ClusterName: !Sub "${AWS::StackName}-cluster"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-cluster"

  HelloWorldTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn: HelloWorldLogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Runs the built Java JAR with an in-task Nginx proxy; 256 CPU and 512 MiB are sufficient for the prototype.
        must:
          - Use the immutable commit-tagged image supplied by the workflow.
          - Keep the Java app health check and Nginx startup dependency.
          - Tag each task definition revision with the Docker base image and source commit.
        mutable: review-required
    Properties:
      Family: !Sub "${AWS::StackName}-task"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: arn:aws:iam::798452926315:role/ecsTaskExecutionRole
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: hello-world
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - Name: app
              ContainerPort: 8080
              Protocol: tcp
              AppProtocol: http
          HealthCheck:
            Command:
              - CMD
              - java
              - -cp
              - /app/hello-world.jar
              - hello.HealthCheck
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 20
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref HelloWorldLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

        - Name: hello-world-proxy
          Image: nginx:alpine
          Essential: true
          DependsOn:
            - ContainerName: hello-world
              Condition: HEALTHY
          PortMappings:
            - Name: http
              ContainerPort: 80
              Protocol: tcp
              AppProtocol: http
          Command:
            - /bin/sh
            - -c
            - |
              cat > /etc/nginx/conf.d/default.conf <<'EOF'
              server {
                listen 80;
                location / {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                }
              }
              EOF
              exec nginx -g 'daemon off;'
          HealthCheck:
            Command:
              - CMD-SHELL
              - wget -q -O /dev/null http://127.0.0.1/ || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 10
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref HelloWorldLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: proxy
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-task"
        - Key: base-image
          Value: !Ref BaseImage
        - Key: source-revision
          Value: !Ref SourceRevision

  HelloWorldService:
    Type: AWS::ECS::Service
    DependsOn:
      - HelloWorldCluster
      - HelloWorldSecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Keeps one Fargate task running with a public IP in the existing public subnet.
        must:
          - Keep AssignPublicIp enabled so the task can pull its ECR image and be reached through the internet gateway.
          - Keep DesiredCount at one for the cost-conscious prototype.
        mutable: review-required
    Properties:
      ServiceName: !Sub "${AWS::StackName}-service"
      Cluster: !Ref HelloWorldCluster
      TaskDefinition: !Ref HelloWorldTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnetId
          SecurityGroups:
            - !Ref HelloWorldSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-service"

Outputs:
  ClusterName:
    Description: ECS cluster name
    Value: !Ref HelloWorldCluster
  ServiceName:
    Description: ECS service name
    Value: !GetAtt HelloWorldService.Name
  TaskDefinitionArn:
    Description: Registered task definition revision
    Value: !Ref HelloWorldTaskDefinition
  SecurityGroupId:
    Description: Security group allowing public browser access through HTTP port 80
    Value: !Ref HelloWorldSecurityGroup
