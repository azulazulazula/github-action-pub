name: Orchestrate AWS resource deployments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfm/vpc/**'
      - '.github/workflows/cfm/ec2.yml'
      - '.github/workflows/cfm/s3/**'
      - '.github/workflows/cfm/ecs/**'
      - 'Dockerfile'
      - 'src/**'
      - '.github/ecs/**'
      - '.github/deploy/dependency.yml'
      - '.github/scripts/create-deploy-plan.py'
      - '.github/scripts/execute-deploy-plan.py'
      - '.github/scripts/requirements.txt'
      - '.github/workflows/deploy-aws-resources.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-aws-resources-main
  cancel-in-progress: false
  queue: max

jobs:
  orchestrate:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deployment-plan dependencies
        run: python -m pip install -r .github/scripts/requirements.txt

      - name: Create deployment plan
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python .github/scripts/create-deploy-plan.py \
            --before "$EVENT_BEFORE" \
            --after "$EVENT_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/deploy-plan.json"

      - name: Execute deployment plan
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_REF: main
        run: |
          python .github/scripts/execute-deploy-plan.py \
            --plan "$RUNNER_TEMP/deploy-plan.json" \
            --ref "$DEPLOY_REF"

      - name: Upload deployment plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deploy-plan.json
          if-no-files-found: ignore
