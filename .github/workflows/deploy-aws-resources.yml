name: Orchestrate AWS resource deployments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfm/vpc/**'
      - '.github/workflows/cfm/ec2.yml'
      - '.github/workflows/cfm/s3/**'
      - 'Dockerfile'
      - 'src/**'
      - '.github/ecs/**'
      - '.github/deploy/dependencies.yaml'
      - '.github/scripts/resolve-dependencies.rb'
      - '.github/workflows/deploy-aws-resources.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-aws-resources-main
  cancel-in-progress: false
  queue: max

jobs:
  orchestrate:
    runs-on: ubuntu-22.04
    environment: prod
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Ruby for dependency YAML
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Detect changed resources
        id: detect
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_BEFORE" =~ ^0+$ ]]; then
            changed_files=$(git diff-tree --no-commit-id --name-only -r "$EVENT_SHA")
          else
            changed_files=$(git diff --name-only "$EVENT_BEFORE" "$EVENT_SHA")
          fi

          declare -A changed=()
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/cfm/vpc/*)
                changed[vpc]=1
                ;;
              .github/workflows/cfm/ec2.yml)
                changed[ec2]=1
                ;;
              .github/workflows/cfm/s3/*)
                changed[s3]=1
                ;;
              Dockerfile|src/*|.github/ecs/*)
                changed[ecs]=1
                ;;
            esac
          done <<< "$changed_files"

          resources=""
          for resource in vpc s3 ec2 ecs; do
            if [[ -n "${changed[$resource]:-}" ]]; then
              [[ -z "$resources" ]] || resources+=","
              resources+="$resource"
            fi
          done

          echo "resources=$resources" >> "$GITHUB_OUTPUT"
          echo "Changed resources: ${resources:-none}"

      - name: Resolve prerequisites and deployment order
        id: resolve
        env:
          TARGETS: ${{ steps.detect.outputs.resources }}
        run: |
          set -euo pipefail
          resources=$(ruby .github/scripts/resolve-dependencies.rb "$TARGETS")
          echo "resources=$resources" >> "$GITHUB_OUTPUT"
          echo "Resolved deployment order: ${resources:-none}"

      - name: Dispatch resource workflows sequentially
        if: ${{ steps.resolve.outputs.resources != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESOURCES: ${{ steps.resolve.outputs.resources }}
          DEPLOY_REF: main
        run: |
          set -euo pipefail

          IFS=, read -r -a resources <<< "$RESOURCES"
          for resource in "${resources[@]}"; do
            case "$resource" in
              vpc)
                workflow="create-vpc.yml"
                ;;
              s3)
                workflow="create-s3.yml"
                ;;
              ec2)
                workflow="deploy-ec2.yml"
                ;;
              ecs)
                workflow="deploy-ecs-hello-world.yml"
                ;;
              *)
                echo "Unknown resource workflow: $resource" >&2
                exit 1
                ;;
            esac

            request_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$resource"
            run_title="Deploy $resource request $request_id"
            echo "::group::Dispatch and wait for $resource"

            jq -n --arg ref "$DEPLOY_REF" --arg request_id "$request_id" \
              '{ref: $ref, inputs: {request_id: $request_id}}' |
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" \
                --input -

            run_id=""
            for attempt in $(seq 1 120); do
              run_id=$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=$DEPLOY_REF&event=workflow_dispatch&per_page=100" |
                jq -r --arg title "$run_title" \
                  '.workflow_runs[] | select(.display_title == $title) | .id' |
                head -n 1)
              if [[ -n "$run_id" ]]; then
                break
              fi
              sleep 5
            done

            if [[ -z "$run_id" ]]; then
              echo "Could not find dispatched run '$run_title'" >&2
              exit 1
            fi

            completed=false
            for attempt in $(seq 1 360); do
              run_state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" |
                jq -r '[.status, (.conclusion // "")] | @tsv')
              status=${run_state%%$'\t'*}
              conclusion=${run_state#*$'\t'}

              if [[ "$status" == "completed" ]]; then
                completed=true
                if [[ "$conclusion" != "success" ]]; then
                  echo "$resource workflow finished with conclusion: $conclusion" >&2
                  exit 1
                fi
                break
              fi
              sleep 10
            done

            if [[ "$completed" != "true" ]]; then
              echo "Timed out waiting for $resource workflow run $run_id" >&2
              exit 1
            fi

            echo "::endgroup::"
          done
