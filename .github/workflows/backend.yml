name: backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/**'
  schedule:
    - cron: '0 14 * * *'

defaults:
  run:
    working-directory: backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22.x

      - run: npm ci
      - run: npm run test -- --coverage
      - run: npm run build
      - run: node dist/index.js &
      - run: npx wait-on -t 10000 http://localhost:8080/api/health
      - run: npm run test:api

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: azula-artifact
          path: backend/coverage/**
          retention-days: 10
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: backend/dist/index.js
          retention-days: 10

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: backend/dist
          retention-days: 10
      - uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.BACKEND_SRV_SSH }}
          known_hosts: ${{ secrets.BACKEND_SRV_KNOWN_HOST }}
      - run: rsync -v  dist/index.js ${SERVER_USER}@${SERVER_IP}:~/index.js
        env:
          SERVER_USER: ${{ secrets.BACKEND_SRV_USER }}
          SERVER_IP: ${{ secrets.BACKEND_SRV_IP }}
      - run: ssh ${SERVER_USER}@${SERVER_IP} sudo systemctl restart backend
        env:
          SERVER_USER: ${{ secrets.BACKEND_SRV_USER }}
          SERVER_IP: ${{ secrets.BACKEND_SRV_IP }}
      - run: ssh ${SERVER_USER}@${SERVER_IP} sudo systemctl status backend
        env:
          SERVER_USER: ${{ secrets.BACKEND_SRV_USER }}
          SERVER_IP: ${{ secrets.BACKEND_SRV_IP }}