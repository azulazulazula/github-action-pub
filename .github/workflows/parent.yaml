name: Parent resource workflow
run-name: Parent resource workflow request ${{ github.run_id }}-${{ github.run_attempt }}

on:
  # main宛てのPRで起動し、変更対象の判定はdepend.txtに集約します。
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      compare_to:
        description: 手動実行で変更比較の基準にするブランチ
        required: true
        default: main
        type: string

permissions:
  contents: read
  actions: write

jobs:
  run-resources-in-order:
    name: Detect and run changed resources
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Create ordered resource plan
        id: plan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMPARE_TO: ${{ inputs.compare_to }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
            target_ref="$GITHUB_BASE_REF"
          else
            if [[ -z "$COMPARE_TO" ]]; then
              echo "Set compare_to to the branch to compare against." >&2
              exit 1
            fi
            git fetch --no-tags origin "$COMPARE_TO"
            base_sha=$(git merge-base FETCH_HEAD "$GITHUB_SHA")
            head_sha="$GITHUB_SHA"
            target_ref="$GITHUB_REF_NAME"
          fi

          git diff --name-only "$base_sha" "$head_sha" > "$RUNNER_TEMP/changed-files.txt"
          python .github/scripts/create-resource-plan.py \
            --manifest depend.txt \
            --changed-files "$RUNNER_TEMP/changed-files.txt" \
            --output "$RUNNER_TEMP/resource-plan.json"

          plan_file="$RUNNER_TEMP/resource-plan.json"
          has_changes=$(jq -r '(.execution_order | length) > 0' "$plan_file")
          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"
          echo "target_ref=$target_ref" >> "$GITHUB_OUTPUT"
          echo "plan_file=$plan_file" >> "$GITHUB_OUTPUT"

          {
            echo "## Resource execution plan"
            echo
            echo "Changed paths:"
            if [[ -s "$RUNNER_TEMP/changed-files.txt" ]]; then
              sed 's/^/- /' "$RUNNER_TEMP/changed-files.txt"
            else
              echo "- (none)"
            fi
            echo
            echo "Services selected in order:"
            if [[ "$has_changes" == "true" ]]; then
              jq -r '.execution_order[] | "- " + .' "$plan_file"
            else
              echo "- None; no resource child workflows will be started."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch each selected child workflow and wait
        if: steps.plan.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ steps.plan.outputs.target_ref }}
          PLAN_FILE: ${{ steps.plan.outputs.plan_file }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t services < <(jq -r '.execution_order[]' "$PLAN_FILE")
          index=0
          for service in "${services[@]}"; do
            service_display=$(printf '%s' "$service" | tr '[:lower:]' '[:upper:]')
            workflow_file="childresource.yaml"
            workflow_path=".github/workflows/$workflow_file"
            if [[ ! -f "$workflow_path" ]]; then
              echo "共通子ワークフローが見つかりません: $workflow_path (サービス: $service)" >&2
              exit 1
            fi

            index=$((index + 1))
            request_id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$index"
            expected_title="Echo $service_display from parent $request_id"

            echo "共通子ワークフローを起動します: $service (request $request_id)"
            gh workflow run "$workflow_file" \
              --ref "$TARGET_REF" \
              --field "service_name=$service_display" \
              --field "request_id=$request_id"

            child_run_id=""
            for attempt in {1..30}; do
              child_run_id=$(gh run list \
                --workflow "$workflow_file" \
                --branch "$TARGET_REF" \
                --event workflow_dispatch \
                --limit 50 \
                --json databaseId,displayTitle \
                | jq -r --arg title "$expected_title" '.[] | select(.displayTitle == $title) | .databaseId' \
                | head -n 1)

              if [[ -n "$child_run_id" ]]; then
                break
              fi
              sleep 2
            done

            if [[ -z "$child_run_id" ]]; then
              echo "Could not find the child workflow run for request $request_id." >&2
              exit 1
            fi

            gh run watch "$child_run_id" --exit-status --interval 2
          done
