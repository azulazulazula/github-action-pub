name: Parent resource workflow
run-name: Parent resource workflow request ${{ github.run_id }}-${{ github.run_attempt }}

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  run-resources-in-order:
    name: Run resource workflows in depend.txt order
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Dispatch and wait for each resource workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f depend.txt ]]; then
            echo "depend.txt was not found at the repository root." >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            target_ref="$GITHUB_BASE_REF"
          else
            target_ref="$GITHUB_REF_NAME"
          fi

          index=0
          while IFS= read -r service || [[ -n "$service" ]]; do
            service="${service%$'\\r'}"
            if [[ -z "$service" ]]; then
              continue
            fi

            if [[ ! "$service" =~ ^[A-Za-z][A-Za-z0-9_-]*$ ]]; then
              echo "Invalid service name in depend.txt: $service" >&2
              exit 1
            fi

            service_key="${service,,}"
            service_display="${service^^}"
            workflow_file="resource-${service_key}.yml"
            workflow_path=".github/workflows/$workflow_file"
            if [[ ! -f "$workflow_path" ]]; then
              echo "No child workflow exists for service '$service' ($workflow_path)." >&2
              exit 1
            fi

            index=$((index + 1))
            request_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${index}"
            expected_title="Echo $service_display request $request_id"

            echo "Dispatching $workflow_file for $service (request $request_id)"
            gh workflow run "$workflow_file" \
              --ref "$target_ref" \
              --field "request_id=$request_id"

            child_run_id=""
            for attempt in {1..30}; do
              child_run_id=$(gh run list \
                --workflow "$workflow_file" \
                --branch "$target_ref" \
                --event workflow_dispatch \
                --limit 50 \
                --json databaseId,displayTitle \
                | jq -r --arg title "$expected_title" '.[] | select(.displayTitle == $title) | .databaseId' \
                | head -n 1)

              if [[ -n "$child_run_id" ]]; then
                break
              fi
              sleep 2
            done

            if [[ -z "$child_run_id" ]]; then
              echo "Could not find the child workflow run for request $request_id." >&2
              exit 1
            fi

            gh run watch "$child_run_id" --exit-status --interval 2
          done < depend.txt
