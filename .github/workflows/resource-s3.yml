name: Echo S3 resource

on:
  workflow_dispatch:
    inputs:
      parent_run_id:
        description: Parent workflow run identifier
        required: true
        type: string

run-name: Echo S3 from parent ${{ inputs.parent_run_id }}

permissions:
  contents: read

jobs:
  echo-service:
    runs-on: ubuntu-latest
    steps:
      - name: Echo service name
        run: echo "S3"
