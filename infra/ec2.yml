AWSTemplateFormatVersion: "2010-09-09"
Description: Prototype EC2 instance in the default VPC

Parameters:
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Latest Amazon Linux 2023 ARM64 AMI

  VpcId:
    Type: AWS::EC2::VPC::Id

  SubnetId:
    Type: AWS::EC2::Subnet::Id

  SshCidr:
    Type: String
    Description: Your public IPv4 address with /32, stored as GitHub secret SSH_CIDR
    AllowedPattern: '^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/32$'
    ConstraintDescription: Enter one IPv4 address followed by /32.

Resources:
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH from the configured client IP
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: SSH from configured client IP
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
      Tags:
        - Key: Name
          Value: eiei-mun-ec2-prototype

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: t4g.micro
      KeyName: eiei-mun
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SubnetId
          GroupSet:
            - !Ref InstanceSecurityGroup
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
      MetadataOptions:
        HttpTokens: required
      Tags:
        - Key: Name
          Value: eiei-mun-ec2-prototype

Outputs:
  InstanceId:
    Value: !Ref Instance
  PublicIp:
    Value: !GetAtt Instance.PublicIp
